[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-laboratory"
version = "0.1.0"
description = "Exact CPU-only attention distribution and scaling experiments"
requires-python = ">=3.10"

[project.scripts]
al = "attention_laboratory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
